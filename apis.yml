name: Advanced Biohealing
description: Advanced BioHealing, Inc. was a regenerative medicine company best known for Dermagraft, a
  cryopreserved human fibroblast-derived dermal substitute used to treat diabetic foot ulcers. The company
  acquired the Dermagraft assets from Smith & Nephew in 2006, was backed by Canaan Partners and other venture
  investors, and was acquired by Shire plc for $750 million in cash in June 2011 to seed Shire's regenerative
  medicine business unit. Dermagraft was later sold to Organogenesis in 2014. Advanced BioHealing no longer
  operates as an independent entity and publishes no public developer portal, API, or programmatic surface;
  this profile is retained in the API Evangelist network as a venture-portfolio company record.
